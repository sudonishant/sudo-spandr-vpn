name: CI Test & Audit Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Models & Manifest
        run: |
          python -c "import json; meta = json.load(open('models/meta.json')); print('Models meta loaded:', meta['sklearn'])"
          python -c "import json; m = json.load(open('samples/manifest.json')); print('Samples available:', len(m))"

      - name: Run Test Suite
        run: |
          pytest tests -q -v
