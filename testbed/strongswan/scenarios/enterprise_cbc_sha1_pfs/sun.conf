# enterprise_cbc_sha1_pfs (sun): AES-256-CBC + HMAC-SHA1-96 (SHOULD NOT), MODP-2048, PFS modp2048
connections {
    enterprise_cbc_sha1_pfs {
        version = 2
        local_addrs  = 192.168.0.2
        remote_addrs = 192.168.0.1
        proposals = aes256-sha1-modp2048
        rekey_time = 4h
        # strongSwan sends IKEV2_FRAGMENTATION_SUPPORTED by default; keep it
        fragmentation = yes
        local {
            auth = psk
            id = sun.xray.test
        }
        remote {
            auth = psk
            id = moon.xray.test
        }
        children {
            enterprise_cbc_sha1_pfs-child {
                local_ts  = 10.2.0.0/16
                remote_ts = 10.1.0.0/16
                esp_proposals = aes256-sha1-modp2048
                rekey_time = 3m     # short so that captures contain CREATE_CHILD_SA rekeys (PFS evidence)
                start_action = trap
                dpd_action = restart
            }
        }
    }
}

secrets {
    ike-xray {
        id-moon = moon.xray.test
        id-sun = sun.xray.test
        secret = "ipsec-xray-testbed-psk-change-me"
    }
}
