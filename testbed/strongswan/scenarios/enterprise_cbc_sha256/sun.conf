# enterprise_cbc_sha256 (sun): Typical enterprise: AES-128-CBC + HMAC-SHA2-256, MODP-2048, PSK, tunnel, no PFS
connections {
    enterprise_cbc_sha256 {
        version = 2
        local_addrs  = 192.168.0.2
        remote_addrs = 192.168.0.1
        proposals = aes128-sha256-modp2048
        rekey_time = 4h
        # strongSwan sends IKEV2_FRAGMENTATION_SUPPORTED by default; keep it
        fragmentation = yes
        local {
            auth = psk
            id = sun.xray.test
        }
        remote {
            auth = psk
            id = moon.xray.test
        }
        children {
            enterprise_cbc_sha256-child {
                local_ts  = 10.2.0.0/16
                remote_ts = 10.1.0.0/16
                esp_proposals = aes128-sha256
                rekey_time = 3m     # short so that captures contain CREATE_CHILD_SA rekeys (PFS evidence)
                start_action = trap
                dpd_action = restart
            }
        }
    }
}

secrets {
    ike-xray {
        id-moon = moon.xray.test
        id-sun = sun.xray.test
        secret = "ipsec-xray-testbed-psk-change-me"
    }
}
