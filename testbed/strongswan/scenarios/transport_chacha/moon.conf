# transport_chacha (moon): Host-to-host transport mode with ChaCha20-Poly1305 and X25519 PFS
connections {
    transport_chacha {
        version = 2
        local_addrs  = 192.168.0.1
        remote_addrs = 192.168.0.2
        proposals = chacha20poly1305-prf-hmac-sha256-x25519
        rekey_time = 10m
        # strongSwan sends IKEV2_FRAGMENTATION_SUPPORTED by default; keep it
        fragmentation = yes
        local {
            auth = pubkey
            certs = moonCert.pem
            id = moon.xray.test
        }
        remote {
            auth = pubkey
            id = sun.xray.test
        }
        children {
            transport_chacha-child {
                mode = transport
                local_ts  = 192.168.0.1
                remote_ts = 192.168.0.2
                esp_proposals = chacha20poly1305-x25519
                rekey_time = 2m     # short so that captures contain CREATE_CHILD_SA rekeys (PFS evidence)
                start_action = start
                dpd_action = restart
            }
        }
    }
}
