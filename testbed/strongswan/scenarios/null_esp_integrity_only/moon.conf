# null_esp_integrity_only (moon): ESP with NULL encryption + HMAC-SHA2-256 (integrity only) - inner IP visible
connections {
    null_esp_integrity_only {
        version = 2
        local_addrs  = 192.168.0.1
        remote_addrs = 192.168.0.2
        proposals = aes128-sha256-modp2048
        rekey_time = 4h
        # strongSwan sends IKEV2_FRAGMENTATION_SUPPORTED by default; keep it
        fragmentation = yes
        local {
            auth = psk
            id = moon.xray.test
        }
        remote {
            auth = psk
            id = sun.xray.test
        }
        children {
            null_esp_integrity_only-child {
                local_ts  = 10.1.0.0/16
                remote_ts = 10.2.0.0/16
                esp_proposals = null-sha256
                rekey_time = 3m     # short so that captures contain CREATE_CHILD_SA rekeys (PFS evidence)
                start_action = start
                dpd_action = restart
            }
        }
    }
}

secrets {
    ike-xray {
        id-moon = moon.xray.test
        id-sun = sun.xray.test
        secret = "ipsec-xray-testbed-psk-change-me"
    }
}
