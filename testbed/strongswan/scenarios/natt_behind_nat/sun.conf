# natt_behind_nat (sun): Road-warrior style: initiator behind NAT -> UDP 4500 encapsulation, AES-128-GCM, PSK+EAP-MSCHAPv2 style (PSK here)
connections {
    natt_behind_nat {
        version = 2
        local_addrs  = 192.168.0.2
        remote_addrs = 192.168.0.1
        proposals = aes128gcm16-prf-hmac-sha256-modp2048
        rekey_time = 4h
        # strongSwan sends IKEV2_FRAGMENTATION_SUPPORTED by default; keep it
        fragmentation = yes
        encap = yes            # force UDP 4500 encapsulation even without a NAT in between
        local {
            auth = psk
            id = sun.xray.test
        }
        remote {
            auth = psk
            id = moon.xray.test
        }
        children {
            natt_behind_nat-child {
                local_ts  = 10.2.0.0/16
                remote_ts = 10.1.0.0/16
                esp_proposals = aes128gcm16-modp2048
                rekey_time = 3m     # short so that captures contain CREATE_CHILD_SA rekeys (PFS evidence)
                start_action = trap
                dpd_action = restart
            }
        }
    }
}

secrets {
    ike-xray {
        id-moon = moon.xray.test
        id-sun = sun.xray.test
        secret = "ipsec-xray-testbed-psk-change-me"
    }
}
