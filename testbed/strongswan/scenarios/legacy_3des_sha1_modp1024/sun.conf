# legacy_3des_sha1_modp1024 (sun): Legacy: 3DES-CBC + SHA1, MODP-1024 (weakdh), PSK, no PFS - expect grade F
connections {
    legacy_3des_sha1_modp1024 {
        version = 2
        local_addrs  = 192.168.0.2
        remote_addrs = 192.168.0.1
        proposals = 3des-sha1-modp1024
        rekey_time = 8h
        # strongSwan sends IKEV2_FRAGMENTATION_SUPPORTED by default; keep it
        fragmentation = yes
        local {
            auth = psk
            id = sun.xray.test
        }
        remote {
            auth = psk
            id = moon.xray.test
        }
        children {
            legacy_3des_sha1_modp1024-child {
                local_ts  = 10.2.0.0/16
                remote_ts = 10.1.0.0/16
                esp_proposals = 3des-sha1
                rekey_time = 5m     # short so that captures contain CREATE_CHILD_SA rekeys (PFS evidence)
                start_action = trap
                dpd_action = restart
            }
        }
    }
}

secrets {
    ike-xray {
        id-moon = moon.xray.test
        id-sun = sun.xray.test
        secret = "ipsec-xray-testbed-psk-change-me"
    }
}
