# good_gcm_pfs (moon): Best practice: IKEv2 AES-256-GCM / SHA-384 PRF / ECP-384, ESP AES-256-GCM, tunnel, PFS ecp384, certificates
connections {
    good_gcm_pfs {
        version = 2
        local_addrs  = 192.168.0.1
        remote_addrs = 192.168.0.2
        proposals = aes256gcm16-prf-hmac-sha384-ecp384
        rekey_time = 10m
        # strongSwan sends IKEV2_FRAGMENTATION_SUPPORTED by default; keep it
        fragmentation = yes
        local {
            auth = pubkey
            certs = moonCert.pem
            id = moon.xray.test
        }
        remote {
            auth = pubkey
            id = sun.xray.test
        }
        children {
            good_gcm_pfs-child {
                local_ts  = 10.1.0.0/16
                remote_ts = 10.2.0.0/16
                esp_proposals = aes256gcm16-ecp384
                rekey_time = 2m     # short so that captures contain CREATE_CHILD_SA rekeys (PFS evidence)
                start_action = start
                dpd_action = restart
            }
        }
    }
}
