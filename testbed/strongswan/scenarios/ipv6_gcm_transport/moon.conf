# ipv6_gcm_transport (moon): IPv6 host-to-host transport mode, AES-128-GCM, ECP-256 PFS (needs the ipv6 compose overlay)
connections {
    ipv6_gcm_transport {
        version = 2
        local_addrs  = fd00:c0de::1
        remote_addrs = fd00:c0de::2
        proposals = aes128gcm16-prf-hmac-sha256-ecp256
        rekey_time = 10m
        # strongSwan sends IKEV2_FRAGMENTATION_SUPPORTED by default; keep it
        fragmentation = yes
        local {
            auth = pubkey
            certs = moonCert.pem
            id = moon.xray.test
        }
        remote {
            auth = pubkey
            id = sun.xray.test
        }
        children {
            ipv6_gcm_transport-child {
                mode = transport
                local_ts  = fd00:c0de::1
                remote_ts = fd00:c0de::2
                esp_proposals = aes128gcm16-ecp256
                rekey_time = 2m     # short so that captures contain CREATE_CHILD_SA rekeys (PFS evidence)
                start_action = start
                dpd_action = restart
            }
        }
    }
}
