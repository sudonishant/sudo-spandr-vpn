# strongSwan 6 daemon configuration used by both gateways in the testbed
charon {
    load_modular = yes
    plugins {
        include /etc/strongswan.d/charon/*.conf
    }
    # short retransmission so that captures contain rekeys quickly
    retransmit_tries = 3
    retransmit_timeout = 2.0
    # log negotiated algorithms - handy for labelling captures
    filelog {
        stderr {
            default = 1
            ike = 2
            cfg = 2
        }
    }
}
swanctl {
    load = pem pkcs1 x509 revocation constraints pubkey openssl random
}
