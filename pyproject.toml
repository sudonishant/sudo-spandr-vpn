[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ipsec-xray"
version = "1.0.0"
description = "AI-powered IPsec VPN protocol analyzer and security assessment framework"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Team Sudo Spandr", email = "sudonishant@gmail.com"}
]
keywords = ["ipsec", "ikev2", "ikev1", "esp", "vpn", "cybersecurity", "sih2026", "ntro"]
dependencies = [
    "scapy>=2.6.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.0.0",
    "PyYAML>=6.0",
    "Jinja2>=3.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    "reportlab>=4.0.0",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0"
]

[project.scripts]
ipsec-xray = "ipsec_xray.cli:main"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
